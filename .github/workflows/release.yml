name: Release
# Installateurs : Windows (.exe, NSIS) et macOS (.dmg, Apple Silicon et Intel), et fichiers de MISE À JOUR AUTOMATIQUE.
#  - Étiquette « v* » : la version GitHub est PUBLIÉE avec les installateurs, et `latest.json` (lu par l'application pour
#    proposer la mise à jour) est joint si le secret de signature existe.
#  - Lancement manuel (« Run workflow ») : les installateurs sont déposés en artefacts de l'exécution (30 jours), rien n'est publié.
# Signature des mises à jour : le secret TAURI_SIGNING_PRIVATE_KEY (clé privée, jamais dans le dépôt) signe les archives ; la
# clé PUBLIQUE est dans tauri.conf.json. Sans ce secret, les installateurs sont construits mais sans mise à jour automatique.
# Les installateurs eux-mêmes ne sont pas signés par un certificat : Windows et macOS afficheront un avertissement.
on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: 'URL du projet Supabase (publique) ; vide = application en mode local seulement'
        required: false
      supabase_anon_key:
        description: 'Clé PUBLIABLE du projet (publique par conception, jamais la clé secrète)'
        required: false
  push:
    tags: ['v*']
permissions: { contents: read }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '--bundles nsis', label: windows-x64 }
          - {
              # macos-14 (Apple Silicon) : « macos-latest » est resté sans exécuteur libre 20 minutes puis a été annulé (0.1.4).
              os: macos-14,
              args: '--target aarch64-apple-darwin --bundles app,dmg',
              label: macos-arm64,
            }
          - {
              os: macos-15-intel,
              args: '--target x86_64-apple-darwin --bundles app,dmg',
              label: macos-x64,
            }
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    env:
      # Configuration cloud intégrée au build (valeurs publiques) : saisie manuelle, ou variables du dépôt pour les étiquettes.
      VITE_SUPABASE_URL: ${{ inputs.supabase_url || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ inputs.supabase_anon_key || vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: pnpm install --frozen-lockfile
      - name: La signature des mises à jour est-elle configurée ?
        id: sig
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "on=false" >> "$GITHUB_OUTPUT"; echo "::warning::TAURI_SIGNING_PRIVATE_KEY absent : pas de mise à jour automatique pour cette version"; fi
      - name: Construire (et publier si étiquette)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'Slate __VERSION__'
          releaseBody: 'Installateurs non signés par un certificat (Windows .exe, macOS .dmg Apple Silicon et Intel) : Windows et macOS afficheront un avertissement de sécurité. Sur Mac, clic droit sur Slate puis Ouvrir.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ steps.sig.outputs.on == 'true' }}
          args: ${{ matrix.args }} ${{ steps.sig.outputs.on == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
      - name: Artefacts (lancement manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: slate-${{ matrix.label }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
