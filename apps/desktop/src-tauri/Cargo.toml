[package]
name = "slate"
version = "0.1.1"
description = "Slate — productivité et gestion des connaissances"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[lib]
name = "slate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.23.1"
argon2 = "0.5"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

# Argon2 (hachage du PIN) est volontairement coûteux : on l'optimise même en développement/tests pour garder des tests rapides.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
